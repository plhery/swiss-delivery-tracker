    <rect x="126" y="166" width="260" height="220" rx="26" fill="#fff"/>
    <!-- lid shading -->
    <rect x="126" y="166" width="260" height="58" rx="26" fill="#f1e9e0"/>
    <rect x="126" y="198" width="260" height="26" fill="#f1e9e0"/>
