<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Swiss Delivery Tracker sign-in code</title>
  </head>
  <body
    style="margin: 0; background: #f3f0e7; color: #1d1d1b; font-family: Arial, sans-serif"
  >
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="max-width: 520px; background: #ffffff; border-radius: 18px"
          >
            <tr>
              <td style="padding: 32px">
                <p style="margin: 0 0 10px; font-size: 14px; font-weight: 700">
                  Swiss Delivery Tracker
                </p>
                <h1 style="margin: 0 0 16px; font-size: 25px; line-height: 1.25">
                  Your sign-in code
                </h1>
                <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.5">
                  Enter this code to open your delivery tracker:
                </p>
                <p
                  style="margin: 0 0 24px; padding: 16px; border-radius: 12px; background: #ffcf00; font-size: 32px; font-weight: 700; letter-spacing: 8px; text-align: center"
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0; color: #666; font-size: 13px; line-height: 1.5">
                  If you did not request this code, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
