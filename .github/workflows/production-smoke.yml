name: Production origin smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Cloudflare Access to the uncached origin
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.DELIVERY_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.DELIVERY_CF_ACCESS_CLIENT_SECRET }}
        run: scripts/smoke-url.sh https://delivery.plhery.com
