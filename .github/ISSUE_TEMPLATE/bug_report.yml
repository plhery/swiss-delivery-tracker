name: Bug report
description: Report a reproducible problem in Parcel Post.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please omit tracking numbers, access keys, push endpoints, and other private delivery data.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Tap …
        3. See …
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser/PWA, operating system, and deployment type.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tracking numbers, tokens, email addresses, and capability URLs first.
